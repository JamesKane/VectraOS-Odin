# boot/limine.conf: Limine's configuration. build copies it to
# /boot/limine/limine.conf on the EFI system partition; a scenario's
# cmdline= is appended to it. The kernel finds its modules by name: svcd,
# the root task; ktest, the kernel's tests in user space, started instead of
# svcd with vx.root=ktest; and bootfs.tar, the boot image.

timeout: 0

/VectraOS
    protocol: limine
    path: boot():/boot/vx/kernel.elf
    module_path: boot():/boot/vx/svcd
    module_path: boot():/boot/vx/ktest
    module_path: boot():/boot/vx/bootfs.tar
